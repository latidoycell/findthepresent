<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the Christmas Present</title>
<style>
:root{--bg1:#fffaf0;--bg2:#fff0d6;--ink:#1d3b2a;--gold:#e0a82e;--red:#c62f2f;--tree:#2f9e5b;--tree2:#1f7a43;--card:rgba(255,255,255,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,#ffd9d9 0,transparent 38%),radial-gradient(circle at 88% 15%,#d6f3e0 0,transparent 38%),radial-gradient(circle at 50% 100%,#fff3b8 0,transparent 45%),linear-gradient(var(--bg1),var(--bg2));background-color:var(--bg1);overflow-x:hidden;text-align:center}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,6vw,3rem);margin:6px 0;color:var(--red);text-shadow:0 2px 0 #fff,0 5px 12px rgba(198,47,47,.25)}
.sub{margin:0 0 14px;opacity:.9}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:2px solid var(--gold);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:var(--ink);border:0;padding:8px 18px;font:inherit;cursor:pointer}
.seg button.on{background:var(--gold);color:#3a2a00;font-weight:700}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);border:2px solid var(--gold);color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.stats{display:flex;gap:18px;justify-content:center;margin-bottom:10px;font-size:1.05rem}
#msg{min-height:2.2em;font-size:1.25rem;font-weight:700;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{position:relative;aspect-ratio:3/4;background:var(--card);border:2px solid rgba(224,168,46,.55);border-radius:16px;box-shadow:0 3px 10px rgba(29,59,42,.12);cursor:pointer;padding:0;color:var(--ink);font:inherit;transition:transform .15s}
.tile:hover:not(:disabled){transform:translateY(-4px) scale(1.03)}
.tile:disabled{cursor:default}
.tile svg{width:100%;height:100%;display:block}
.num{position:absolute;left:0;right:0;bottom:6%;font-weight:800;font-size:clamp(.9rem,3.4vw,1.4rem);color:#fff8e7;text-shadow:0 1px 3px #000}
.prize{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2.8rem,12vw,5rem);filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));animation:pop .7s cubic-bezier(.2,1.5,.4,1) both,wiggle .6s ease-in-out .7s infinite;transform-origin:50% 80%}
.tile.win{border-color:var(--gold);box-shadow:0 0 26px var(--gold);z-index:2;background:#fff6c9}
.tile.wrong{animation:shake .4s;opacity:.55}
.tile.wrong .tree{filter:grayscale(.7)}
@keyframes pop{0%{transform:translateY(40%) scale(.2) rotate(-40deg);opacity:0}60%{transform:translateY(-35%) scale(1.5) rotate(15deg);opacity:1}100%{transform:translateY(-10%) scale(1.15) rotate(0)}}
@keyframes wiggle{0%,100%{transform:translateY(-10%) scale(1.15) rotate(0)}20%{transform:translateY(-16%) scale(1.2) rotate(-14deg)}40%{transform:translateY(-10%) scale(1.15) rotate(12deg)}60%{transform:translateY(-16%) scale(1.2) rotate(-10deg)}80%{transform:translateY(-10%) scale(1.15) rotate(8deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sleigh{position:fixed;top:12px;left:-90px;font-size:2rem;z-index:1;animation:fly 18s linear infinite;pointer-events:none}
@keyframes fly{to{left:110%}}
@media (prefers-reduced-motion:reduce){.sleigh{display:none}.tile,.prize{animation:none!important;transition:none}}
@media (max-width:520px){.grid.g20{grid-template-columns:repeat(4,1fr);gap:6px}}
@media (min-width:600px) and (orientation:landscape){main:has(.grid.g20){max-width:none;padding-left:16px;padding-right:16px}.grid.g20{grid-template-columns:repeat(10,1fr);gap:8px}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="sleigh" aria-hidden="true">🛷🦌</div>
<main>
<h1>🎄 Find the Present 🎁</h1>
<p class="sub">One tree is hiding a present. Tap a tree to look behind it!</p>
<div class="bar">
  <div class="seg" role="group" aria-label="Number of trees">
    <button id="m10" class="on">10 trees</button>
    <button id="m20">20 trees</button>
  </div>
  <button class="btn" id="again">New game</button>
  <button class="btn alt" id="music" aria-pressed="false">🔇 Music off</button>
</div>
<div class="stats"><span>Tries: <b id="tries">0</b></span><span>Wins: <b id="wins">0</b></span><span>Best: <b id="best">–</b></span></div>
<div id="msg" role="status" aria-live="polite">Pick a tree!</div>
<div class="grid" id="grid"></div>
</main>
<script>
(function(){
var N=10,secret=0,tries=0,wins=0,best=null,over=false,musicOn=false;
var grid=document.getElementById('grid'),msg=document.getElementById('msg');
var AC=window.AudioContext||window.webkitAudioContext,ctx=null;
function ac(){if(!ctx&&AC)ctx=new AC();if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,t,d,type,vol,dest){var c=ac();if(!c)return;var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;var s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol||.2,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(dest||c.destination);o.start(s);o.stop(s+d+.05)}
function good(){[784,988,1175,1568].forEach(function(f,i){tone(f,i*.11,.35,'triangle',.22);tone(f*2,i*.11,.2,'sine',.06)})}
function bad(){tone(220,0,.25,'sawtooth',.15);tone(165,.2,.45,'sawtooth',.15)}
function bells(){[1319,1568].forEach(function(f,i){tone(f,i*.05,.25,'sine',.1)})}
/* Background music: Jingle-Bells-style phrase (original arrangement, public-domain tune) */
var mTimer=null,step=0;
var mel=[[659,1],[659,1],[659,2],[659,1],[659,1],[659,2],[659,1],[784,1],[523,1.5],[587,.5],[659,4],[698,1],[698,1],[698,1.5],[698,.5],[698,1],[659,1],[659,1],[659,.5],[659,.5],[659,1],[587,1],[587,1],[659,1],[587,2],[784,2]];
function playNote(){if(!musicOn)return;var n=mel[step%mel.length];var beat=.28;tone(n[0],0,n[1]*beat*.9,'triangle',.07);tone(n[0]*2,0,n[1]*beat*.6,'sine',.025);step++;mTimer=setTimeout(playNote,n[1]*beat*1000)}
var mb=document.getElementById('music');
mb.onclick=function(){musicOn=!musicOn;mb.setAttribute('aria-pressed',musicOn);mb.textContent=musicOn?'🔔 Music on':'🔇 Music off';clearTimeout(mTimer);if(musicOn){ac();step=0;playNote()}};
function treeSVG(){return '<svg class="tree" viewBox="0 0 60 80" aria-hidden="true"><polygon points="30,4 49,30 11,30" fill="#2f9e5b"/><polygon points="30,18 54,50 6,50" fill="#278a4e"/><polygon points="30,32 58,68 2,68" fill="#1f7a43"/><rect x="26" y="68" width="8" height="10" fill="#7a4b22"/><polygon points="30,0 32,5 37,5 33,8 35,13 30,10 25,13 27,8 23,5 28,5" fill="#f6c453"/><circle cx="24" cy="30" r="2.5" fill="#d63a3a"/><circle cx="38" cy="46" r="2.5" fill="#f6c453"/><circle cx="20" cy="58" r="2.5" fill="#4aa3ff"/><circle cx="42" cy="62" r="2.5" fill="#d63a3a"/></svg>'}
function build(){
  grid.innerHTML='';grid.className='grid'+(N===20?' g20':'');
  secret=Math.floor(Math.random()*N)+1;tries=0;over=false;
  document.getElementById('tries').textContent=0;
  msg.textContent='Pick a tree!';
  for(var i=1;i<=N;i++){
    var b=document.createElement('button');b.className='tile';b.dataset.n=i;b.setAttribute('aria-label','Tree number '+i);
    b.innerHTML=treeSVG()+'<span class="num">'+i+'</span>';
    b.onclick=pick;grid.appendChild(b);
  }
}
function pick(e){
  if(over)return;var t=e.currentTarget,n=+t.dataset.n;ac();
  tries++;document.getElementById('tries').textContent=tries;
  if(n===secret){
    over=true;wins++;document.getElementById('wins').textContent=wins;
    if(best===null||tries<best){best=tries;document.getElementById('best').textContent=best}
    t.classList.add('win');t.disabled=true;
    var p=document.createElement('div');p.className='prize';p.textContent='🎁';t.appendChild(p);
    msg.textContent='🎉 Correct! The present was behind tree '+n+' (found in '+tries+(tries===1?' try)':' tries)');
    good();
  }else{
    t.classList.add('wrong');t.disabled=true;
    msg.textContent='❌ Wrong! Nothing behind tree '+n+'. Try another!';
    bad();
  }
}
function mode(n){N=n;document.getElementById('m10').classList.toggle('on',n===10);document.getElementById('m20').classList.toggle('on',n===20);build();bells()}
document.getElementById('m10').onclick=function(){mode(10)};
document.getElementById('m20').onclick=function(){mode(20)};
document.getElementById('again').onclick=function(){build();bells()};
build();
/* Snow */
var cv=document.getElementById('snow'),g=cv.getContext('2d'),fl=[],W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(var i=0;i<70;i++)fl.push({x:Math.random()*2000,y:Math.random()*1200,r:1+Math.random()*3,s:.4+Math.random()*1.2,d:Math.random()*6});
var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function snow(){g.clearRect(0,0,W,H);g.fillStyle='rgba(120,175,230,.75)';fl.forEach(function(f){f.y+=f.s;f.d+=.02;f.x+=Math.sin(f.d)*.5;if(f.y>H){f.y=-5;f.x=Math.random()*W}g.beginPath();g.arc(f.x%W,f.y,f.r,0,7);g.fill()});if(!still)requestAnimationFrame(snow)}
snow();
})();
</script>
</body>
</html>
